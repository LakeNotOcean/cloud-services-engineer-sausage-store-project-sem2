        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-{{ .Chart.Name }}-secret
        ports:
        - containerPort: {{ .Values.containerPort }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | default "256Mi" }}
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
          limits:
            memory: {{ .Values.resources.limits.memory | default "512Mi" }}
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{.Values.storage }}
      

# C:\Projects\yandex\cloud-services-engineer-sausage-store-project-sem2\sausage-store-chart\charts\infra\charts\mongodb\templates\init.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-mongodb-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300   # РђРІС‚РѕРѕС‡РёСЃС‚РєР° С‡РµСЂРµР· 5 РјРёРЅСѓС‚ РїРѕСЃР»Рµ Р·Р°РІРµСЂС€РµРЅРёСЏ
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mongodb-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: waiting
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-mongodb-service {{ .Values.global.mongoPort }}; do
                echo "Waiting for MongoDB..."
                sleep 3
              done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: mongodb-init
          image: "mongo:7.0" 
          command:
            - mongosh
          args:
            - --host
            - {{ .Release.Name }}-mongodb-service
            - --port
            - "{{ .Values.global.mongoPort }}"
            - --username
            - "$(MONGO_INITDB_ROOT_USERNAME)"
            - --password
            - "$(MONGO_INITDB_ROOT_PASSWORD)"
            - --authenticationDatabase
            - admin
            - --eval
            - |
              db = db.getSiblingDB('{{ .Values.global.reportDbName }}');
              if (!db.getUser('{{ .Values.global.reportDbUser }}')) {
                db.createUser({
                  user: '{{ .Values.global.reportDbUser }}',
                  pwd: '{{ .Values.global.reportDbPassword }}',
                  roles: [{ role: 'readWrite', db: '{{ .Values.global.reportDbName }}' }]
                });
                print('User {{ .Values.global.reportDbUser }} created successfully.');
              } else {
                print('User {{ .Values.global.reportDbUser }} already exists, skipping.');
              }
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

# C:\Projects\yandex\cloud-services-engineer-sausage-store-project-sem2\sausage-store-chart\charts\infra\charts\mongodb\templates\secret.yaml
