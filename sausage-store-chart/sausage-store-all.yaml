# C:\Projects\yandex\cloud-services-engineer-sausage-store-project-sem2\sausage-store-chart\charts\backend\values.yaml
# Р°РЅРЅРѕС‚Р°С†РёРё Pormetheus
annotations:
  path: /actuator/prometheus
  port: "8080"
  scrape: "true"

# РїСѓС‚Рё Р°СЂС‚РµС„Р°РєС‚РѕРІ
env:
  reportPath: "/logs/reports"
  logPath: "/logs"

# РїРѕСЂС‚С‹ РєРѕРЅС‚РµР№РЅРµСЂР°
service:
  port: 8080
containerPort: 8080

# СЃС‚СЂР°С‚РµРіРёСЏ СЂРµРїР»РёРєР°С†РёРё
revisionHistoryLimit: 15
replicas: 1
strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

# РґР°РЅРЅС‹Рµ РѕР±СЂР°Р·Р°
image:
  repository: "lakenotocean" 
  name: sausage-backend
  tag: latest
imagePullPolicy: Always

# Р·Р°РїСЂРѕСЃ СЂРµСЃСѓСЂСЃРѕРІ
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "1"

# РїСЂРѕРІРµСЂРєР°
livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 5
  periodSeconds: 10

# vpa 
vpa:
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: backend
      controlledResources: ["cpu", "memory"]

