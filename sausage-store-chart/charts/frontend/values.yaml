replicas: 1
revisionHistoryLimit: 15
strategy:
  type: Recreate
service:
  port: 80
ingress:
  host: front-nevskiy-va.students-projects.ru
  path: /
  pathType: Prefix
  tlsSecret: 2sem-students-projects-wildcard-secret
containerPort: 80
image:
  repository: "" 
  name: sausage-frontend
  tag: latest
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "1"
nginxConf: nginx.conf