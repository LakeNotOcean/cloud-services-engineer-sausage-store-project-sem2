# порты контейнера
service:
  port: 80
containerPort: 80

# стратегии репликации
replicas: 1
revisionHistoryLimit: 15
strategy:
  type: Recreate

# данные образа
image:
  repository: "lakenotocean" 
  name: sausage-frontend
  tag: latest

# сеть
ingress:
  host: front-nevskiy-va.students-projects.ru
  path: /
  pathType: Prefix
  tlsSecret: 2sem-students-projects-wildcard-secret

# запрос ресурсов
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "1"
nginxConf: nginx.conf