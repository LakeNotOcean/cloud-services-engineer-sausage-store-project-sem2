apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.global.mongoRootUser }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.global.mongoRootPassword }}
  REPORT_DB_CONNECTION_STRING: mongodb://{{ .Values.global.reportDbUser }}:{{ .Values.global.reportDbPassword }}@{{ .Release.Name }}-mongodb-service:{{ .Values.global.mongoPort }}/{{ .Values.global.reportDbName }}