apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-service
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.containerPort }}
      protocol: TCP
      targetPort: {{ .Values.containerPort }}
  selector:
    app: {{ .Release.Name }}-{{ .Chart.Name }}