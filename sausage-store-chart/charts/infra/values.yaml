postgresql:
  storage: 2Gi
  storageClassName: "standard"
  image: postgres:13-alpine
  containerPort: 5432
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
      
mongodb:
  storage: 1Gi
  containerPort: 27017
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"