name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_HOST: ${{ secrets.VAULT_HOST }}

jobs:
  # Сборка и пуш образов в докерхаб:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v4
        - name: Set up Docker Buildx
          # Установка сборщика контейнеров Docker:
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          # Авторизация на Docker Hub:
          uses: docker/login-action@v2
          # При помощи with передаём в action параметры username и password:
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            # Хорошо ли держать логин и пароль прямо в коде workflow?
            # Нет, это нехорошо. Хранить пароль надо в Secrets.
        - name: Push Backend to DockerHub
          # Одновременный билд и пуш образа в Docker Hub:
          uses: docker/build-push-action@v4
          with:
            # Параметр context: ./backend/ указывает, что нужный Dockerfile 
            # находится в ./backend/
            context: ./backend/
            # Параметр push: true указывает, что образ нужно не только собрать,
            # но и отправить на Docker Hub:
            push: true
            # В параметре tags задаётся название и тег для образа.
            # Для каждого пересобранного образа 
            # устанавливаем тег latest, чтобы потом
            # на сервере и в docker-compose.yml не указывать версию образа:
            tags: ${{ secrets.DOCKER_USER }}/sausage-backend:latest
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/sausage-frontend:latest
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend-report/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/sausage-backend-report:latest
            build-args: |
              VERSION=${{ github.sha }}
  # Упаковываем helm-чарт и пушим его в Nexus
  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub

      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Package Helm chart
        run: helm package ./sausage-store-chart
      - name: Upload chart to Nexus
        run: |
          CHART=$(ls sausage-store-*.tgz | head -1)
          curl --fail \
            -u "${NEXUS_HELM_REPO_USER}:${NEXUS_HELM_REPO_PASSWORD}" \
            --upload-file "${CHART}" \
            "${NEXUS_HELM_REPO}/"
  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus

      steps:
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Configure kube
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Add Nexus Helm repository
        run: |
          helm repo add nexus "${NEXUS_HELM_REPO}" \
            --username "${NEXUS_HELM_REPO_USER}" \
            --password "${NEXUS_HELM_REPO_PASSWORD}"
          helm repo update
      # Секреты из vault
      - name: Fetch secrets from Vault via API
        id: vault
        run: |
          SECRETS=$(curl -sS --fail \
            -H "X-Vault-Token: ${{ env.VAULT_TOKEN }}" \
            "${{ env.VAULT_HOST }}:8201/v1/secret/data/sausage-store" | jq -r '.data.data')

          POSTGRES_USER=$(echo "$SECRETS" | jq -r '.postgresUser')
          POSTGRES_PASSWORD=$(echo "$SECRETS" | jq -r '.postgresPassword')
          MONGO_USER=$(echo "$SECRETS" | jq -r '.mongoRootUser')
          MONGO_PASSWORD=$(echo "$SECRETS" | jq -r '.mongoRootPassword')
          REPORT_USER=$(echo "$SECRETS" | jq -r '.reportDbUser')
          REPORT_PASSWORD=$(echo "$SECRETS" | jq -r '.reportDbPassword')
          
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$MONGO_PASSWORD"
          echo "::add-mask::$REPORT_PASSWORD"
          
          echo "postgres_user=$POSTGRES_USER" >> $GITHUB_OUTPUT
          echo "postgres_password=$POSTGRES_PASSWORD" >> $GITHUB_OUTPUT
          echo "mongo_user=$MONGO_USER" >> $GITHUB_OUTPUT
          echo "mongo_password=$MONGO_PASSWORD" >> $GITHUB_OUTPUT
          echo "report_user=$REPORT_USER" >> $GITHUB_OUTPUT
          echo "report_password=$REPORT_PASSWORD" >> $GITHUB_OUTPUT
      # Развертывание кластера
      - name: Deploy app
        run: |
          helm upgrade --install sausage-store nexus/sausage-store \
            --namespace "${SAUSAGE_STORE_NAMESPACE}" \
            --set global.vault.vaultToken="${{ secrets.VAULT_TOKEN }}" \
            --set global.postgresUser="${{ steps.vault.outputs.postgres_user }}" \
            --set global.postgresPassword="${{ steps.vault.outputs.postgres_password }}" \
            --set global.mongoRootUser="${{ steps.vault.outputs.mongo_user }}" \
            --set global.mongoRootPassword="${{ steps.vault.outputs.mongo_password }}" \
            --set global.reportDbUser="${{ steps.vault.outputs.report_user }}" \
            --set global.reportDbPassword="${{ steps.vault.outputs.report_password }}"