.k8s_defaults:
  variables:
    CHART_ROOT: "${CI_PROJECT_DIR}/sausage-store-chart"
    BACKEND_IMAGE: "${DOCKER_USER}/sausage-backend:latest"
    FRONTEND_IMAGE: "${DOCKER_USER}/sausage-frontend:latest"
    REPORT_IMAGE: "${DOCKER_USER}/sausage-backend-report:latest"

# сборка и пуш Docker-образов в DockerHub
docker_build_push:
  extends: .k8s_defaults
  stage: build
  tags:
    - docker
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--registry-mirror=https://dockerhub.timeweb.cloud"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "${DOCKER_USER}" -p "${DOCKER_PASSWORD}"
    # Для кэширования
    - docker buildx create --driver docker-container --name ci --use
  script:
    - |
      docker buildx build --build-arg VERSION="${CI_COMMIT_SHA}" \
        --cache-from type=registry,ref=${DOCKER_USER}/sausage-backend:buildcache \
        --cache-to type=registry,ref=${DOCKER_USER}/sausage-backend:buildcache,mode=max \
        --push -t "${BACKEND_IMAGE}" -t "${DOCKER_USER}/sausage-backend:${CI_COMMIT_SHORT_SHA}" ./backend/
    - |
      docker buildx build \
        --cache-from type=registry,ref=${DOCKER_USER}/sausage-frontend:buildcache \
        --cache-to type=registry,ref=${DOCKER_USER}/sausage-frontend:buildcache,mode=max \
        --push -t "${FRONTEND_IMAGE}" -t "${DOCKER_USER}/sausage-frontend:${CI_COMMIT_SHORT_SHA}" ./frontend/
    - |
      docker buildx build \
        --cache-from type=registry,ref=${DOCKER_USER}/sausage-backend-report:buildcache \
        --cache-to type=registry,ref=${DOCKER_USER}/sausage-backend-report:buildcache,mode=max \
        --push -t "${REPORT_IMAGE}" -t "${DOCKER_USER}/sausage-backend-report:${CI_COMMIT_SHORT_SHA}" ./backend-report/
  rules:
    - if: '$OPERATION == "k8s"'
  allow_failure: false

# обновление helm-чарта в Nexus
helm_package_push:
  extends: .k8s_defaults
  stage: package
  image:
    name: alpine/helm:4.3
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - apk add --no-cache curl yq
  script:
    - cd "${CHART_ROOT}"
    - yq -i '.backend.image.tag = strenv(CI_COMMIT_SHORT_SHA) | ."backend-report".image.tag = strenv(CI_COMMIT_SHORT_SHA) | .frontend.image.tag = strenv(CI_COMMIT_SHORT_SHA)' values.yaml
    - yq -i '.version = "0.1." + strenv(CI_PIPELINE_IID)' Chart.yaml
    - helm package .
    - curl --fail -u "${NEXUS_HELM_REPO_USER}:${NEXUS_HELM_REPO_PASSWORD}" --upload-file sausage-store-*.tgz "${NEXUS_HELM_REPO}/"
  needs:
    - docker_build_push
  rules:
    - if: '$OPERATION == "k8s"'
      when: manual
  allow_failure: false
