.terraform_defaults:
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/infra"
    TF_HTTP_ADDRESS: "https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate"
    TF_HTTP_LOCK_ADDRESS: "https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_USERNAME: "terraform"
    TF_HTTP_PASSWORD: "${TF_HTTP_PASSWORD_SECRET}"
    TF_VAR_folder_id: "${TF_VAR_FOLDER_ID}"
    TF_VAR_zone: "${TF_VAR_ZONE}"
    TF_VAR_catalog_name: "${TF_VAR_CATALOG_NAME}"
    TF_VAR_image_id: "${TF_VAR_IMAGE_ID}"
    TF_VAR_vm_user: "${TF_VAR_VM_USER}"
    TF_VAR_ssh_public_key: "${TF_VAR_SSH_PUBLIC_KEY}"
    TF_VAR_cores: "${TF_VAR_CORES}"
    TF_VAR_memory: "${TF_VAR_MEMORY}"
    TF_VAR_core_fraction: "${TF_VAR_CORE_FRACTION}"
    TF_VAR_disk_size: "${TF_VAR_DISK_SIZE}"
.setup_key:
  - echo "${AUTHORIZED_KEY}" | base64 -d > "${TF_ROOT}/authorized_key.json"

terraform_fmt:
  extends: .terraform_defaults
  stage: validate
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  script:
    - cd "${TF_ROOT}"
    - terraform fmt -check -recursive
  rules:
    - if: '$OPERATION == "terraform"'
  allow_failure: true

terraform_validate:
  extends: .terraform_defaults
  stage: validate
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - cd "${TF_ROOT}"
    - checkov -d . --config-file .checkov.yml
  rules:
    - if: '$OPERATION == "terraform"'
  allow_failure: true

terraform_plan:
  extends: .terraform_defaults
  stage: plan
  needs:
    - terraform_fmt
    - terraform_validate
  before_script:
    - !reference [.setup_key]
  script:
    - cd "${TF_ROOT}"
    - terraform init
    - terraform plan -out=tfplan
    - terraform show tfplan
  artifacts:
    name: "tfplan-${CI_COMMIT_SHA}"
    paths:
      - "${TF_ROOT}/tfplan"
    expire_in: 1 week
  rules:
    - if: '$OPERATION == "terraform"'
  allow_failure: false

terraform_apply:
  extends: .terraform_defaults
  stage: apply
  needs:
    - job: terraform_plan
      artifacts: true
  before_script:
    - !reference [.setup_key]
  script:
    - cd "${TF_ROOT}"
    - terraform init
    - terraform apply tfplan
  artifacts:
    paths:
      - "${TF_ROOT}/outputs.json"
  rules:
    - if: '$OPERATION == "terraform"'
      when: manual
  allow_failure: false

terraform_destroy:
  extends: .terraform_defaults
  stage: destroy
  needs:
    - job: terraform_plan
      artifacts: true
  before_script:
    - !reference [.setup_key]
  script:
    - cd "${TF_ROOT}"
    - terraform init
    - terraform destroy -auto-approve
  rules:
    - if: '$OPERATION == "terraform"'
      when: manual
  allow_failure: false

terratest:
  extends: .terraform_defaults
  stage: terratest
  image:
    name: golang:1.27
    entrypoint: [""]
  before_script:
    - !reference [.setup_key]
  script:
    - cd "${TF_ROOT}/test"
    - go mod init terratest
    # из-за конфликтов
    - go get github.com/gruntwork-io/terratest@v0.46.16
    - go get github.com/yandex-cloud/go-sdk@latest
    - go get github.com/yandex-cloud/go-genproto@latest
    - go get github.com/stretchr/testify@latest
    - go mod tidy
    - go test -v -timeout 30m
  needs:
    - job: terraform_apply
      artifacts: true
  rules:
    - if: '$OPERATION == "terraform"'
  allow_failure: false