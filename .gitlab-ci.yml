include:
  - local: '/.gitlab/ci/terraform.yml'
  - local: '/.gitlab/ci/ansible.yml'
  - local: '/.gitlab/ci/k8s.yml'


stages:
  - validate
  - plan
  - apply
  - terratest

variables:
  OPERATION:
    description: "Select CI/CD-operation"
    value: "terraform"
    options:
      - "terraform"
      - "ansible"
      - "k8s"