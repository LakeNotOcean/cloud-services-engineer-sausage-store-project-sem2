apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sausage-store-s18727602
spec:
  project: s18727602
  destination:
    namespace: ep-namespace-a4970852f9974b88b52fea26-g1
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'https://nexus.infra.students-projects.ru/repository/s18727602-helm'
    targetRevision: '0.1.*'
    chart: sausage-store
    helm:
      values: |
        global:
          imageRegistry: "lakenotocean"
          imagePullPolicy: Always

          postgresDbName: "store"
          postgresUser: "store"
          postgresPassword: "storepassword"
          postgresPort: "5432"

          mongoRootUser: "root"
          mongoRootPassword: "rootpassword"
          mongoPort: "27017"

          reportDbName: "sausage-store"
          reportDbUser: "report_user"
          reportDbPassword: "report_pass"
          initContainers:
            mongo:
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "100m"
          vault:
            enabled: true
            host: "89.169.151.100"
            port: 8200
            scheme: http
            name: vault
            vaultToken: someToken

        backend:
          image:
            repository: ""
            name: sausage-backend

        backend-report:
          image:
            repository: ""
            name: sausage-backend-report

        frontend:
          image:
            repository: ""
            name: sausage-frontend

        infra:
          postgresql:
            storage: 2Gi
            storageClassName: "yc-network-hdd"
          mongodb:
            storage: 1Gi
            storageClassName: "yc-network-hdd"

  syncPolicy:
    automated:
      prune: false
      selfHeal: false