apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sausage-store-s18727602
spec:
  project: project-s18727602
  destination:
    namespace: r-devops-magistracy-project-3sem-1646581078
    server: 'https://kubernetes.default.svc'
  source:
    path: ''
    repoURL: 'https://nexus.cloud-services-engineer.education-services.ru/repository/nevskiy-va-sausage-store'
    targetRevision: 0.1.0
    chart: sausage-store
    helm:
      values: |
        global:
          imageRegistry: "lakenotocean"
          imagePullPolicy: Always

          postgresDbName: "store"
          postgresUser: "store"
          postgresPassword: "storepassword"
          postgresPort: "5432"

          mongoRootUser: "root"
          mongoRootPassword: "rootpassword"
          mongoPort: "27017"

          reportDbName: "sausage-store"
          reportDbUser: "report_user"
          reportDbPassword: "report_pass"
          initContainers:
            mongo:
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "100m"
          vault:
            enabled: true
            host: "93.77.183.14"
            port: 8201
            scheme: http
            name: vault
            vaultToken: someToken

        backend:
          image:
            repository: ""
            name: sausage-backend
            tag: latest

        backend-report:
          image:
            repository: ""
            name: sausage-backend-report
            tag: latest

        frontend:
          image:
            repository: ""
            name: sausage-frontend
            tag: latest

        infra:
          postgresql:
            storage: 2Gi
            storageClassName: "yc-network-hdd"
          mongodb:
            storage: 1Gi
            storageClassName: "yc-network-hdd"
  syncPolicy:
    automated:
      prune: false
      selfHeal: false